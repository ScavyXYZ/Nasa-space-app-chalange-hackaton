name: Validate Mars Explorer
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt -r requirements-browser.txt
      - run: git lfs pull --include="data/processed/*.npy,data/processed/hirise/*.npy,data/processed/regional/*.npy,data/processed/regional/*.geojson,data/processed/**/*.npz,data/processed/mola128_global/*.img,data/processed/atlas/geology_query.json.gz" --exclude=""
      - run: python scripts/prepare_runtime_data.py
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - name: Production app E2E
        shell: bash
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8001 &
          trap 'kill $!' EXIT
          python - <<'PY'
          import urllib.request,time
          for attempt in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8001/api/health",timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Backend did not become ready")
          PY
          python tests/smoke_english_workspace.py --url http://127.0.0.1:8001
          python tests/smoke_workstation_design.py --url http://127.0.0.1:8001
          python tests/smoke_photo_globe_browser.py --url http://127.0.0.1:8001
          python tests/smoke_point_viewport.py --url http://127.0.0.1:8001
          python tests/smoke_route_viewport.py --url http://127.0.0.1:8001
          python tests/smoke_globe_line.py --url http://127.0.0.1:8001
          python tests/smoke_atlas_coordinates.py --url http://127.0.0.1:8001
          python tests/smoke_preview_latency.py --url http://127.0.0.1:8001
          python tests/smoke_tile_retention.py --url http://127.0.0.1:8001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-browser-results
          path: |
            artifacts/mvp
            artifacts/global
            artifacts/release
            artifacts/workspace
            artifacts/planet
            artifacts/zoom
