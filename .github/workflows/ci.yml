name: Validate Mars Explorer
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt -r requirements-browser.txt
      - run: git lfs pull --include="data/processed/*.npy,data/processed/hirise/*.npy,data/processed/regional/*.npy,data/processed/regional/*.geojson" --exclude=""
      - run: python scripts/prepare_runtime_data.py
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - name: Production app E2E
        shell: bash
        run: |
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8001 &
          trap 'kill $!' EXIT
          python - <<'PY'
          import urllib.request,time
          for attempt in range(60):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8001/api/health",timeout=2)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Backend did not become ready")
          PY
          python tests/smoke_mvp_browser.py
          python tests/smoke_regional_browser.py
          python tests/smoke_globe_browser.py
          python tests/smoke_3d_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-browser-results
          path: artifacts/mvp
